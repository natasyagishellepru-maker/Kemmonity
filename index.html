    var retryKey = 'kem_retry_count';

      el.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;color:#8C8C99">Loading…</div>';
      setTimeout(function () { window.location.reload(); }, 400);
      return;
    }
    el.innerHTML = '<div style="padding:24px;font-family:monospace;white-space:pre-wrap;color:#b00;background:#fff">App failed to load:\n\n' + (e.message || e) + '\n\n' + (e.filename ? (e.filename + ':' + e.lineno) : '') + '\n\nTry reloading the page.</div>';
  }
});
window.addEventListener('load', function () {
  setTimeout(function () { sessionStorage.removeItem('kem_retry_count'); }, 3000);
});
</script>
